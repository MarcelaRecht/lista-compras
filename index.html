<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛒 Lista da Família</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; color: #1a202c; }


    header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; padding: 18px 16px 12px; text-align: center;
      box-shadow: 0 2px 10px rgba(99,102,241,0.3);
    }
    header h1 { font-size: 1.45rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.85; margin-top: 3px; }


    .config-banner {
      background: #fef3c7; border-bottom: 2px solid #fcd34d;
      padding: 10px 16px; text-align: center;
      font-size: 0.82rem; color: #92400e;
    }
    .config-banner a { color: #b45309; font-weight: 700; text-decoration: underline; cursor: pointer; }
    .config-banner.hidden { display: none; }


    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
    }
    .modal-bg.hidden { display: none; }
    .modal {
      background: white; border-radius: 18px; padding: 24px;
      max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    }
